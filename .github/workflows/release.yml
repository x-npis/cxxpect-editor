name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: windows-latest
            name: cxxpect-editor-windows-x86_64.exe
            binary: target/release/cxxpect-editor.exe
          - runner: ubuntu-latest
            name: cxxpect-editor-linux-x86_64
            binary: target/release/cxxpect-editor
          - runner: macos-14
            name: cxxpect-editor-macos-arm64
            binary: target/release/cxxpect-editor
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libgtk-3-dev libxkbcommon-dev libwayland-dev
      - run: cargo build --release
      - shell: bash
        run: cp "${{ matrix.binary }}" "${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.name }}
